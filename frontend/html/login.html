<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Gestion Universitaire</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body id="login-page">
    <header>
        <h1>Portail Universitaire</h1>
    </header>

    <main>
        <div class="form-container">
            <h2>Connexion</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email :</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe :</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <input type="submit" value="Se connecter">
                </div>
                <div id="login-message" class="message" style="display:none;"></div>
            </form>
            <p style="text-align: center; margin-top: 1rem;">
                Pas encore de compte ? <a href="register.html">S'inscrire</a>
                <!-- Le lien d'inscription sera pertinent plus tard -->
            </p>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Université Fictive. Tous droits réservés.</p>
    </footer>

    <script src="../js/auth.js"></script> <!-- Un script JS dédié pour l'authentification -->
</body>
</html>
